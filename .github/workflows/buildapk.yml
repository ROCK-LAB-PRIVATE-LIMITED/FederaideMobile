name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force build and upload release even if tag exists'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Execute buildgradle.sh & Release
    runs-on: ubuntu-latest

    env:
      # Memory Guardrails: Restrict memory consumption to prevent Actions runner OOM
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false -Dorg.gradle.workers.max=2"
      NODE_OPTIONS: "--max-old-space-size=2048"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # --- REQUIREMENT 2: Version Bump & Release Tag Detection ---
      - name: Detect Version Bump & Last Commit Message
        id: version_check
        run: |
          if [ -f "FederaideMobile/package.json" ]; then
            APP_DIR="FederaideMobile"
          else
            APP_DIR="."
          fi
          echo "APP_DIR=$APP_DIR" >> $GITHUB_ENV

          # Extract package.json version
          VERSION=$(node -p "require('./$APP_DIR/package.json').version")
          TAG_NAME="v$VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT

          git fetch --tags --force

          # Capture the exact last commit message for release notes
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_ENV
          echo "$COMMIT_MSG" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          TAG_EXISTS=false
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            TAG_EXISTS=true
          fi

          IS_MANUAL="${{ github.event_name == 'workflow_dispatch' }}"
          FORCE_RELEASE="${{ inputs.force_release }}"

          echo "Target Tag: $TAG_NAME | Exists: $TAG_EXISTS | Manual Run: $IS_MANUAL"

          if [ "$TAG_EXISTS" = "false" ] || [ "$IS_MANUAL" = "true" ] || [ "$FORCE_RELEASE" = "true" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            if [ "$TAG_EXISTS" = "false" ]; then
              echo "create_tag=true" >> $GITHUB_OUTPUT
            else
              echo "create_tag=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "Version $TAG_NAME already released. Skipping build."
            echo "should_build=false" >> $GITHUB_OUTPUT
          fi

      # --- REQUIREMENT 3: Cache Android, Gradle, and NPM Build Assets ---
      - name: Cache Gradle Dependencies & Wrapper
        if: steps.version_check.outputs.should_build == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache NPM Cache
        if: steps.version_check.outputs.should_build == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      # --- REQUIREMENT 4: Run npm audit fix --force ---
      - name: Install Node Modules & Run npm audit fix
        if: steps.version_check.outputs.should_build == 'true'
        working-directory: ${{ env.APP_DIR }}
        run: |
          npm install --legacy-peer-deps
          npm audit fix --force || true

      # --- Prepare Runner Environment for buildgradle.sh Compatibility ---
      - name: Prepare buildgradle.sh Environment Shims
        if: steps.version_check.outputs.should_build == 'true'
        run: |
          # 1. Symlink $ANDROID_HOME to $HOME/Library/Android/sdk as expected by buildgradle.sh
          mkdir -p "$HOME/Library/Android"
          ln -sfn "$ANDROID_HOME" "$HOME/Library/Android/sdk"

          # 2. Create mock /usr/libexec/java_home so buildgradle.sh resolves JAVA_HOME on Linux
          sudo mkdir -p /usr/libexec
          sudo tee /usr/libexec/java_home > /dev/null << 'EOF'
          #!/bin/sh
          echo "$JAVA_HOME"
          EOF
          sudo chmod +x /usr/libexec/java_home

          # Also symlink macOS fallback Java path
          sudo mkdir -p /Library/Java/JavaVirtualMachines/openjdk-17.jdk/Contents
          sudo ln -sfn "$JAVA_HOME" /Library/Java/JavaVirtualMachines/openjdk-17.jdk/Contents/Home

          # 3. Create mock adb in platform-tools so step 5 in buildgradle.sh passes without physical phone
          mkdir -p "$ANDROID_HOME/platform-tools"
          tee "$ANDROID_HOME/platform-tools/adb" > /dev/null << 'EOF'
          #!/bin/sh
          echo "[CI Mock ADB] Ignoring: $@"
          exit 0
          EOF
          chmod +x "$ANDROID_HOME/platform-tools/adb"

          # 4. REQUIREMENT 5: Cap Gradle memory in ~/.gradle/gradle.properties
          mkdir -p ~/.gradle
          cat << 'EOF' >> ~/.gradle/gradle.properties
          org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.workers.max=2
          EOF

      # --- TRIGGER THE EXACT buildgradle.sh SCRIPT ---
      - name: Trigger buildgradle.sh
        if: steps.version_check.outputs.should_build == 'true'
        working-directory: ${{ env.APP_DIR }}
        run: |
          chmod +x buildgradle.sh
          ./buildgradle.sh

      # --- Verify APK Output ---
      - name: Locate Generated Release APK
        if: steps.version_check.outputs.should_build == 'true'
        id: apk_location
        run: |
          APK_SOURCE="${{ env.APP_DIR }}/android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_SOURCE" ]; then
            echo "Error: app-release.apk was not found at $APK_SOURCE"
            exit 1
          fi

          TARGET_APK="FEDERaiDE-v${{ steps.version_check.outputs.VERSION }}.apk"
          cp "$APK_SOURCE" "./$TARGET_APK"
          echo "apk_path=./$TARGET_APK" >> $GITHUB_OUTPUT

      # --- Tag & Release ---
      - name: Create Git Tag
        if: steps.version_check.outputs.should_build == 'true' && steps.version_check.outputs.create_tag == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version_check.outputs.TAG_NAME }}" -m "${{ env.RELEASE_NOTES }}"
          git push origin "${{ steps.version_check.outputs.TAG_NAME }}"

      - name: Publish GitHub Release
        if: steps.version_check.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version_check.outputs.TAG_NAME }}"
          APK_FILE="${{ steps.apk_location.outputs.apk_path }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Updating existing release $TAG..."
            gh release upload "$TAG" "$APK_FILE" --clobber
            gh release edit "$TAG" --notes "${{ env.RELEASE_NOTES }}"
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" "$APK_FILE" \
              --title "FEDERaiDE $TAG" \
              --notes "${{ env.RELEASE_NOTES }}"
          fi
